name: Windows Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (Installer + Portable)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test core logic
        run: npm test

      - name: Build Windows installer and portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foldria-Windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Foldria ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
